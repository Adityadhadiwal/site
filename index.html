<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ZEUSS Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black text-white font-sans">

  <!-- HEADER -->
  <div class="flex justify-between items-center p-5 border-b border-neutral-800">
    <h1 class="text-xl font-bold tracking-wide">ZEUSS</h1>
    <span id="userName" class="text-gray-400 text-sm"></span>
  </div>

  <!-- MAIN -->
  <div class="max-w-3xl mx-auto p-6">

    <!-- TITLE -->
    <h2 class="text-3xl font-bold mb-2">Today's Plan</h2>
    <p class="text-gray-400 mb-6">Execute. Don’t negotiate.</p>

    <!-- PLAN CARD -->
    <div class="bg-neutral-900 p-6 rounded-2xl shadow-lg">

      <div class="mb-4">
        <p class="text-gray-400 text-sm">Workout</p>
        <p id="workout" class="text-lg font-semibold"></p>
      </div>

      <div class="mb-4">
        <p class="text-gray-400 text-sm">Diet</p>
        <p id="diet" class="text-lg font-semibold"></p>
      </div>

      <div class="mb-6">
        <p class="text-gray-400 text-sm">Tasks</p>
        <p id="tasks" class="text-lg font-semibold"></p>
      </div>

      <!-- ACTION BUTTONS -->
      <div class="flex gap-3">
        <button onclick="markDone()" class="flex-1 bg-green-600 py-3 rounded-xl font-semibold hover:opacity-90">
          Done
        </button>
        <button onclick="markSkip()" class="flex-1 bg-red-600 py-3 rounded-xl font-semibold hover:opacity-90">
          Skip
        </button>
      </div>

    </div>

    <!-- STATUS -->
    <div id="statusBox" class="mt-6 hidden bg-neutral-900 p-4 rounded-xl text-center"></div>

  </div>

<script>

// 🔥 USER DATA (EDIT THIS ONLY)
const plans = {
  aditya: {
    name: "Aditya",
    workout: "Push workout (Chest + Triceps)",
    diet: "Normal + high protein focus",
    tasks: "5k steps, 3L water"
  },
  rahul: {
    name: "Rahul",
    workout: "Cardio + Core",
    diet: "Low carb",
    tasks: "8k steps, no sugar"
  }
};

// 🔑 GET USER FROM URL
const params = new URLSearchParams(window.location.search);
const userKey = params.get("user");

// DEFAULT USER
const user = plans[userKey] || plans["aditya"];

// LOAD DATA
document.getElementById("userName").innerText = user.name;
document.getElementById("workout").innerText = user.workout;
document.getElementById("diet").innerText = user.diet;
document.getElementById("tasks").innerText = user.tasks;

// ACTIONS
function markDone() {
  showStatus("✅ Completed. Keep going.");
}

function markSkip() {
  const reason = prompt("Why did you skip?");
  showStatus("⚠️ Skipped: " + reason);
}

function showStatus(msg) {
  const box = document.getElementById("statusBox");
  box.innerText = msg;
  box.classList.remove("hidden");
}

</script>

</body>
</html>
